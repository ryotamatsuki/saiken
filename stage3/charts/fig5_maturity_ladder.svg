<rect x="150" y="60" width="223.33333333333337" height="22" class="bar"/>
<text x="381.33333333333337" y="75" class="s">短期≤2 / 中期2–5 / 長期5–10（R8計画）</text>
<text x="138" y="130" text-anchor="end" class="l">大阪府</text>
<rect x="150" y="115" width="446.66666666666674" height="22" class="bar"/>

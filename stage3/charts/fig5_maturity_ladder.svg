<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<style>text{font-family:sans-serif;fill:#111}.t{font-size:18px;font-weight:700}.l{font-size:14px}.s{font-size:12px}.bar{fill:#777}.grid{stroke:#ddd;stroke-width:1}</style>
<text x="20" y="28" class="t">図5　公表資料で確認できる債券年限（比較可能性に注意）</text>

<text x="261.6666666666667" y="345" text-anchor="middle" class="s">5年</text>
<line x1="373.33333333333337" y1="50" x2="373.33333333333337" y2="325" class="grid"/>
<text x="373.33333333333337" y="345" text-anchor="middle" class="s">10年</text>
<line x1="485.0" y1="50" x2="485.0" y2="325" class="grid"/>
<text x="485.0" y="345" text-anchor="middle" class="s">15年</text>
<line x1="596.6666666666667" y1="50" x2="596.6666666666667" y2="325" class="grid"/>
<text x="596.6666666666667" y="345" text-anchor="middle" class="s">20年</text>
<line x1="708.3333333333334" y1="50" x2="708.3333333333334" y2="325" class="grid"/>

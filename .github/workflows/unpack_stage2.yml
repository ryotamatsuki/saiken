name: Unpack Stage 2 public-only dataset

on:
  push:
    paths:
      - 'stage2_bootstrap/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack Stage 2 payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, io, tarfile
          root = Path('.')
          parts = sorted((root / 'stage2_bootstrap').glob('chunk_*.txt'))
          if not parts:
              raise SystemExit('No Stage 2 bootstrap chunks found')
          payload = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          data = base64.b64decode(payload)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as tf:
              tf.extractall(root)
          print(f'Extracted {len(data)} compressed bytes from {len(parts)} chunks')
          PY

      - name: Validate Stage 2 public-only outputs
        run: |
          test -f stage2/README.md
          test -f stage2/processed/prefecture_R7_R8_public_fund_investment_long.csv
          test -f stage2/processed/prefecture_R7_R8_disclosure_matrix.csv
          test -f stage2/processed/prefecture_R4_R8_integrated.csv
          test -f stage2/processed/public_data_gaps.csv
          test -f stage2/processed/comparison_candidates.csv
          test -f stage2/processed/advanced_management_prefectures.csv
          test -f stage2/processed/QA.csv
          test -f stage2/reports/prefecture_R7_R8_public_fund_investment_analysis.md
          test -f stage2/sources/source_dictionary.csv
          test -f stage2/sources/search_log.csv
          test ! -f stage2/processed/ehime_internal_data_required.csv
          grep -q 'STAGE 2 COMPLETE' stage2/reports/prefecture_R7_R8_public_fund_investment_analysis.md
          ! grep -R -E 'INTERNAL_DATA_REQUIRED|internal_required|ehime_internal_data_required' stage2
          ! grep -q ',FAIL,' stage2/processed/QA.csv
          python - <<'PY'
          import pandas as pd
          a=pd.read_csv('stage2/processed/prefecture_R7_R8_public_fund_investment_long.csv')
          b=pd.read_csv('stage2/processed/prefecture_R7_R8_disclosure_matrix.csv')
          c=pd.read_csv('stage2/processed/prefecture_R4_R8_integrated.csv')
          assert len(a)==94 and a['prefecture'].nunique()==47
          assert a.loc[a.fiscal_year==2025,'prefecture'].nunique()==47
          assert a.loc[a.fiscal_year==2026,'prefecture'].nunique()==47
          assert len(b)==47 and b['prefecture'].nunique()==47
          assert len(c)==235
          print('Stage 2 structural validation PASS')
          PY

      - name: Commit Stage 2 outputs and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage2
          git rm -r stage2_bootstrap
          git rm .github/workflows/unpack_stage2.yml
          git commit -m "Add public-only Stage 2 R7-R8 prefectural fund research"
          git push
